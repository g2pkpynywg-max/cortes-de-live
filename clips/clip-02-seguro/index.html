<!doctype html>
<html lang="pt-BR" data-resolution="portrait">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
      #win { position: absolute; left: 0; top: 460px; width: 1080px; height: 1215px; overflow: hidden; }
      .seg { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 45%; }
      .pan { position: absolute; top: 0; left: 0; width: 2160px; height: 1215px; }
      .fgv { position: absolute; top: 0; left: 0; width: 2160px; height: 1215px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="43.2" data-width="1080" data-height="1920" data-fps="30">

      <div id="dim"></div>
      <div id="win" data-layout-allow-overflow>
        <div class="seg" id="sw0" data-layout-allow-overflow><div class="pan" id="pan0" data-layout-allow-overflow><video id="fg0" class="clip fgv" src="assets/video.mp4" data-start="0.0" data-duration="11.5" data-media-start="4.9" data-track-index="1" muted playsinline></video></div></div>
        <div class="seg" id="sw1" data-layout-allow-overflow><div class="pan" id="pan1" data-layout-allow-overflow><video id="fg1" class="clip fgv" src="assets/video.mp4" data-start="11.5" data-duration="2.0" data-media-start="24.4" data-track-index="1" muted playsinline></video></div></div>

    <script>

    tl.set("#pan0", { x: -540 }, 0);

    tl.to("#sw3", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 40.96);

    tl.fromTo("#cw-crash", { scale: 1.12 }, { scale: 1, duration: 4.85, ease: "power1.out" }, 29.75);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
