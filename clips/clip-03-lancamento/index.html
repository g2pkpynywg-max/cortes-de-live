<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .bgv { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; }
      #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
      #win { position: absolute; left: 0; top: 460px; width: 1080px; height: 1215px; overflow: hidden; }
      .seg { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 45%; }
      .pan { position: absolute; top: 0; left: 0; width: 2160px; height: 1215px; }
      .fgv { position: absolute; top: 0; left: 0; width: 2160px; height: 1215px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37.8" data-width="1080" data-height="1920" data-fps="30">
      <video id="bg0" class="clip bgv" src="assets/bg.mp4" data-start="0.0" data-duration="10.6" data-media-start="3.5" data-track-index="0" muted playsinline></video>
      <video id="bg1" class="clip bgv" src="assets/bg.mp4" data-start="10.6" data-duration="15.0" data-media-start="28.7" data-track-index="0" muted playsinline></video>
      <video id="bg2" class="clip bgv" src="assets/bg.mp4" data-start="25.6" data-duration="1.2" data-media-start="46.5" data-track-index="0" muted playsinline></video>
      <video id="bg3" class="clip bgv" src="assets/bg.mp4" data-start="26.8" data-duration="11.0" data-media-start="53.0" data-track-index="0" muted playsinline></video>
      <div id="dim"></div>
      <div id="win" data-layout-allow-overflow>
        <div class="seg" id="sw0" data-layout-allow-overflow><div class="pan" id="pan0" data-layout-allow-overflow><video id="fg0" class="clip fgv" src="assets/video.mp4" data-start="0.0" data-duration="10.6" data-media-start="3.5" data-track-index="1" muted playsinline></video></div></div>
        <div class="seg" id="sw1" data-layout-allow-overflow><div class="pan" id="pan1" data-layout-allow-overflow><video id="fg1" class="clip fgv" src="assets/video.mp4" data-start="10.6" data-duration="15.0" data-media-start="28.7" data-track-index="1" muted playsinline></video></div></div>
        <div class="seg" id="sw2" data-layout-allow-overflow><div class="pan" id="pan2" data-layout-allow-overflow><video id="fg2" class="clip fgv" src="assets/video.mp4" data-start="25.6" data-duration="1.2" data-media-start="46.5" data-track-index="1" muted playsinline></video></div></div>
        <div class="seg" id="sw3" data-layout-allow-overflow><div class="pan" id="pan3" data-layout-allow-overflow><video id="fg3" class="clip fgv" src="assets/video.mp4" data-start="26.8" data-duration="11.0" data-media-start="53.0" data-track-index="1" muted playsinline></video></div></div>
      </div>
      <div id="overlays" class="clip" data-composition-id="overlays" data-composition-src="compositions/overlays.html"
        data-start="0" data-duration="37.8" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="37.8" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="37.8" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
    tl.set("#pan0", { x: -45 }, 0);
    tl.fromTo("#sw0", { scale: 1.14 }, { scale: 1, duration: 2.0, ease: "power2.out" }, 0.0);
    tl.set("#pan1", { x: -45 }, 0);
    tl.to("#pan1", { x: -540, duration: 0.8, ease: "power2.inOut" }, 18.3);
    tl.fromTo("#sw1", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 10.6);
    tl.to("#sw1", { scale: 1.1, duration: 0.18, ease: "power3.out" }, 18.2);
    tl.to("#sw1", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 19.8);
    tl.set("#pan2", { x: -540 }, 0);
    tl.fromTo("#sw2", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 25.6);
    tl.set("#pan3", { x: -540 }, 0);
    tl.fromTo("#sw3", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 26.8);
    tl.to("#sw3", { scale: 1.08, duration: 0.18, ease: "power3.out" }, 32.6);
    tl.to("#sw3", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 34.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
